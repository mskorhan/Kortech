name: Update Google reviews and deploy

on:
  schedule:
    # 08:00 UTC on the 1st of every month
    - cron: '0 8 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest 5-star Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/fetch-google-reviews.mjs

      - name: Commit updated reviews data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/data/reviews.json; then
            git add src/data/reviews.json
            git commit -m "chore: update Google reviews data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No changes to reviews data."
          fi

      - name: Build site
        run: npm run build

      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_HOST }}
          username: ${{ secrets.BLUEHOST_FTP_USER }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.BLUEHOST_FTP_REMOTE_DIR }}
