name: PR checks

on:
  pull_request:
    branches:
      - main
  # Allows a run to be requested for a specific branch. This exists because a
  # pull_request event raised by GITHUB_TOKEN creates its run in an
  # "approval-required" state that never executes, so the required "build"
  # check never reports and the PR can never merge. Per GitHub's docs,
  # "workflow_dispatch and repository_dispatch events always create workflow
  # runs" - so update-reviews.yml dispatches this workflow explicitly after it
  # pushes its branch. See .github/workflows/update-reviews.yml.
  #
  # This is not a protection bypass: the dispatched run executes this same
  # workflow file, at the same ref, with the same steps that a pull_request run
  # would. It restores the check; it does not skip it.
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was requested
        required: false
        default: automated-dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Install Chrome for prerendering
        run: npx puppeteer browsers install chrome

      - name: Build site
        run: npm run build

  # Behavioural tests that need a built site and a real browser.
  #
  # DELIBERATELY A SEPARATE JOB, not extra steps inside `build`. The ruleset
  # requires the `build` check, so folding these in would silently make them
  # required too - and update-reviews.yml opens automated PRs that must not be
  # blocked by a browser flake. Making this job required is a ruleset change
  # and therefore an owner decision, not something a workflow edit should do by
  # stealth.
  #
  # Cost: the repo is public, so GitHub Actions minutes are free. The visual
  # sweep runs in --quick mode (8 widths including the nav breakpoint, ~18s
  # locally) rather than the full 21-width sweep (~3m20s), which is reserved
  # for the scheduled production run below.
  behaviour:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22, not 20 like the build job. The worker's tests import
          # `../src/index.ts` directly and rely on --experimental-strip-types,
          # which does not exist before 22.6 - on Node 20 the suite fails to
          # load rather than failing an assertion. The build job stays on 20
          # because that is what the deploy workflow uses, and the two must
          # agree about the artifact they produce.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm ci --prefix worker

      - name: Worker request-validation tests
        run: npm run test:worker

      - name: Install Chrome for prerendering
        run: npx puppeteer browsers install chrome

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      # Positive AND negative business-policy assertions against dist/.
      - name: Verify business policies
        run: npm run verify-policies

      # Form validation, spam protection, error handling and a11y. Every
      # request to the notification worker is intercepted, so no test
      # submission can ever reach info@kortechservice.com.
      - name: Form behaviour tests
        run: npm run test:forms

      - name: Navigation and responsive overflow (quick sweep)
        run: npm run test:visual:quick

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            visual-qa-report.json
          if-no-files-found: ignore
          retention-days: 7
