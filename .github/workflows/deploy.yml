name: Build and deploy to Bluehost

on:
  push:
    branches:
      - main

permissions:
  contents: read

# This workflow uploads the built site to Bluehost over FTP. Two runs at once
# would interleave their uploads into the same directory, so a slower earlier
# run could overwrite files from a newer commit and leave production serving a
# mix of two builds. Until now merges had to be serialized by hand.
#
# cancel-in-progress is deliberately false: an in-flight run is already writing
# files to the live host, and killing it mid-upload is what leaves production
# half-updated. Queued runs wait instead. Note that while several runs are
# queued, GitHub keeps only the most recent pending one - which is correct here,
# since each deploy uploads the whole site from the latest main.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for prerendering
        run: npx puppeteer browsers install chrome

      - name: Build site
        run: npm run build

      - name: Deploy to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_HOST }}
          username: ${{ secrets.BLUEHOST_FTP_USER }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.BLUEHOST_FTP_REMOTE_DIR }}

      - name: Notify IndexNow (Bing) of updated URLs
        # Best-effort, runs only after a successful FTP deploy. A temporary
        # IndexNow/network/cache-propagation issue must not fail an
        # otherwise-successful deployment - the script retries with
        # backoff internally, and any residual failure here only emits a
        # workflow warning rather than failing the job.
        run: node scripts/indexnow-ping.mjs || echo "::warning::IndexNow notification failed after retries; website deploy still succeeded. Run 'npm run indexnow-ping' manually to retry."
